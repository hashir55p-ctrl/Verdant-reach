#gmenu .pill,#gmenu .mrow{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;border-radius:16px;padding:0 16px;height:50px;font:600 15px/1 var(--display);letter-spacing:0;text-transform:none;background:var(--panel2);border:1px solid var(--line);color:var(--text);opacity:1;text-align:left}

#gmenu .pill[aria-pressed="false"]{opacity:1}
.resume{background:var(--sun)!important;color:var(--sun-ink)!important;border-color:var(--sun)!important;justify-content:center!important;font-weight:800!important;font-size:16px!important}

@media (max-height:520px){#gmenu .mbox{gap:7px;padding:14px}#gmenu h2{font-size:22px}#gmenu .sub{display:none}#gmenu .pill,#gmenu .mrow{height:42px}}

<script src="three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const isTouch=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
const HINT=isTouch?'Left stick to walk · drag anywhere else to look':'WASD to walk · drag to look · Shift to run · F to fly · T for time';
$('#keys').textContent=HINT;
$('#tip').textContent=HINT;
const say=t=>{$('#say').textContent=t};
const tick=()=>new Promise(r=>setTimeout(r,24));

if(!window.THREE){say('Could not load the 3D engine. Check your connection and reload.');return}

/* ---------- noise ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=mulberry32(481516);
const perm=new Uint8Array(512);
(function(){const p=[];for(let i=0;i<256;i++)p.push(i);for(let i=255;i>0;i--){const j=Math.floor(rand()*(i+1)),t=p[i];p[i]=p[j];p[j]=t}for(let i=0;i<512;i++)perm[i]=p[i&255]})();
function fade(t){return t*t*t*(t*(t*6-15)+10)}
function grad(h,x,y){switch(h&7){case 0:return x+y;case 1:return -x+y;case 2:return x-y;case 3:return -x-y;case 4:return x;case 5:return -x;case 6:return y;default:return -y}}
function noise(x,y){
  const xf=Math.floor(x),yf=Math.floor(y),X=xf&255,Y=yf&255;x-=xf;y-=yf;
  const u=fade(x),v=fade(y),a=perm[X]+Y,b=perm[X+1]+Y;
  return lerp(lerp(grad(perm[a],x,y),grad(perm[b],x-1,y),u),lerp(grad(perm[a+1],x,y-1),grad(perm[b+1],x-1,y-1),u),v);
}
function fbm(x,y,o){let s=0,a=1,f=1,n=0;for(let i=0;i<o;i++){s+=noise(x*f,y*f)*a;n+=a;a*=0.5;f*=2}return s/n}
/* tileable noise for textures */
function hsh(a,b){return perm[perm[a&255]+(b&255)]}
function pn(x,y,Px,Py){
  const xf=Math.floor(x),yf=Math.floor(y);
  const X0=((xf%Px)+Px)%Px,Y0=((yf%Py)+Py)%Py,X1=(X0+1)%Px,Y1=(Y0+1)%Py;
  const fx=x-xf,fy=y-yf,u=fade(fx),v=fade(fy);
  return lerp(lerp(grad(hsh(X0,Y0),fx,fy),grad(hsh(X1,Y0),fx-1,fy),u),lerp(grad(hsh(X0,Y1),fx,fy-1),grad(hsh(X1,Y1),fx-1,fy-1),u),v);
}
function fbmP(u,v,Px,Py,o){let s=0,a=1,n=0,f=1;for(let i=0;i<o;i++){s+=pn(u*Px*f,v*Py*f,Px*f,Py*f)*a;n+=a;a*=0.5;f*=2}return s/n}

/* ---------- world shape ---------- */
const R=520;
const LAKE={x:125,z:-60,r:58};
const PEAK={x:-110,z:-140};
const DESERT={x:-230,z:170,r:140},SWAMP={x:200,z:230,r:125},FROST={x:-210,z:-250,r:140};
const zoneW=(Z,x,z)=>{const d=Math.hypot(x-Z.x,z-Z.z);return 1-smooth(Z.r*0.5,Z.r*1.05+fbm(x*0.012+Z.x*0.01,z*0.012+Z.z*0.01,2)*30,d)};
function catmull(pts,sub){const o=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
  for(let k=0;k<sub;k++){const t=k/sub,t2=t*t,t3=t2*t;const f=j=>0.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3);o.push([f(0),f(1)])}}
  o.push(pts[pts.length-1]);return o}
const RIVER_W=6;
const RIVERS=[catmull([[-60,-92],[-20,-98],[15,-72],[55,-80],[88,-60]],8),catmull([[150,-22],[185,12],[212,68],[268,98],[330,168],[400,250],[470,330]],8)];
const RIVER_BB=RIVERS.map(pl=>{let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const q of pl){a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[0]);d=Math.max(d,q[1])}return [a-24,b-24,c+24,d+24]});
function riverD(x,z){let best=1e9;for(let r=0;r<RIVERS.length;r++){const bb=RIVER_BB[r];if(x<bb[0]||x>bb[2]||z<bb[1]||z>bb[3])continue;const pl=RIVERS[r];
  for(let i=0;i<pl.length-1;i++){const a=pl[i],b=pl[i+1],dx=b[0]-a[0],dz=b[1]-a[1];const t=clamp(((x-a[0])*dx+(z-a[1])*dz)/(dx*dx+dz*dz),0,1);const d=Math.hypot(x-a[0]-dx*t,z-a[1]-dz*t);if(d<best)best=d}}return best}
function heightRaw(x,z){
  const d=Math.hypot(x,z);
  const n=fbm(x*0.0048+10,z*0.0048-4,5);
  let h=8+n*30;
  const m=smooth(0.0,0.3,fbm(x*0.003-30,z*0.003+12,3));
  const rg=Math.max(0,1-Math.abs(fbm(x*0.008+50,z*0.008+7,4)*2.2));
  h+=rg*rg*m*70;
  const pd=Math.hypot(x-PEAK.x,z-PEAK.z);
  h+=Math.exp(-(pd*pd)/(2*58*58))*58;
  const c=1-smooth(0,95,d);
  h=lerp(h,5.5+n*5,c*0.95);
  h+=fbm(x*0.035+80,z*0.035-20,3)*1.7;

  /* Smaller landforms add natural variation without changing the island silhouette. */
  const ridgeNoise=fbm(x*0.018-64,z*0.018+31,4);
  const ridges=1-Math.abs(ridgeNoise);
  const ridgeMask=smooth(12,34,h)*(1-smooth(42,58,h));
  h+=Math.pow(ridges,2.2)*5.5*ridgeMask;
  const fineDetail=fbm(x*0.075+17,z*0.075-43,3);
  h+=fineDetail*1.05*smooth(2,12,h);

  /* regions: dunes, marsh, frozen hills */
  const dz=zoneW(DESERT,x,z);
  if(dz>0.001){const dn=fbm(x*0.02+3,z*0.013-8,3)*7+Math.abs(fbm(x*0.045,z*0.045,2))*2.2;h=lerp(h,6.5+dn,dz*0.92)}
  const sw=zoneW(SWAMP,x,z);
  if(sw>0.001){const pl=fbm(x*0.045+9,z*0.045-5,3);h=lerp(h,0.7+pl*4.6,sw*0.94)}
  const fr=zoneW(FROST,x,z);
  if(fr>0.001){h+=fr*(9+fbm(x*0.02-6,z*0.02+4,4)*20)}
  /* rivers */
  const rd=riverD(x,z);
  if(rd<RIVER_W*2.6){const t=(1-smooth(RIVER_W*0.7,RIVER_W*2.6,rd))*(1-smooth(7,13,h));h=lerp(h,Math.min(h,-1.4),t)}

  const ld=Math.hypot(x-LAKE.x,z-LAKE.z);
  h=lerp(h,-5,1-smooth(LAKE.r*0.35,LAKE.r,ld));
  h=lerp(h,-14,smooth(0.72*R,0.98*R,d));
  return h;
}
/* flat building sites */
const SITES=[{n:'Willowmere',x:80,z:125,r:32},{n:'Dune Rest',x:DESERT.x,z:DESERT.z,r:30},{n:'Frostfold',x:FROST.x,z:FROST.z,r:28},{n:'Mistmarsh Landing',x:SWAMP.x,z:SWAMP.z,r:28},{n:'Old Ruins',x:-35,z:-190,r:16},{n:'Hunters Camp',x:160,z:55,r:10}];
(function(){const a=1.55;for(let d=250;d<520;d+=2){const x=Math.cos(a)*d,z=Math.sin(a)*d;if(heightRaw(x,z)<0.8){SITES.push({n:'Lighthouse',x:Math.cos(a)*(d-14),z:Math.sin(a)*(d-14),r:9});break}}})();
function heightAt(x,z){
  let h=heightRaw(x,z);
  for(let i=0;i<SITES.length;i++){const q=SITES[i],dx=x-q.x,dz=z-q.z,d2=dx*dx+dz*dz,rr=q.r*1.6;
    if(d2<rr*rr){if(q.h===undefined)q.h=Math.max(heightRaw(q.x,q.z),2.0);h=lerp(h,q.h,1-smooth(q.r*0.8,rr,Math.sqrt(d2)))}}
  return h;
}
function slopeAt(x,z){
  const e=1.5;
  return Math.max(Math.abs(heightAt(x+e,z)-heightAt(x-e,z)),Math.abs(heightAt(x,z+e)-heightAt(x,z-e)))/(2*e);
}
const forestMask=(x,z)=>fbm(x*0.012+100,z*0.012+3,3);
const groveMask=(x,z)=>fbm(x*0.016+200,z*0.016-9,2);
function biomeAt(x,z){
  const h=heightAt(x,z);
  if(h<-0.4)return Math.hypot(x,z)>R*0.9?'Open Sea':(Math.hypot(x-LAKE.x,z-LAKE.z)<LAKE.r?'Mirror Lake':(riverD(x,z)<RIVER_W*1.6?'River':'Shallows'));
  for(const q of SITES)if(Math.hypot(x-q.x,z-q.z)<q.r)return q.n;
  if(zoneW(DESERT,x,z)>0.5)return 'Sunscar Desert';
  if(zoneW(SWAMP,x,z)>0.5)return 'Mistmarsh';
  if(zoneW(FROST,x,z)>0.5)return 'Frostfields';
  if(h<1.8)return 'Shoreline';
  if(h>44)return 'Snowcap';
  if(h>30)return 'Highland Ridge';
  if(forestMask(x,z)>0.12){const g=groveMask(x,z);return g>0.2?'Blossom Grove':(g<-0.22?'Amber Wood':(h>18?'Pine Ridge':'Greenwood'))}
  return 'Meadow';
}
function hn(ix,iz,k){
  let h=(Math.imul(ix,374761393)+Math.imul(iz,668265263)+Math.imul(k,2147483647))|0;
  h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;
  return (h>>>0)/4294967296;
}

/* ---------- procedural textures ---------- */
function canvasFromFn(size,fn){
  const cv=document.createElement('canvas');cv.width=cv.height=size;
  const ctx=cv.getContext('2d'),img=ctx.createImageData(size,size),d=img.data;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const c=fn(x/size,y/size,x,y),o=(y*size+x)*4;
    d[o]=clamp(c[0],0,255);d[o+1]=clamp(c[1],0,255);d[o+2]=clamp(c[2],0,255);d[o+3]=255;
  }
  ctx.putImageData(img,0,0);return cv;
}
const mix3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function grassFn(u,v){
  const n1=fbmP(u,v,6,6,4),n2=fbmP(u+0.3,v+0.7,24,24,3);
  const t=clamp(0.5+n1*1.3+n2*0.7,0,1);
  let c=t<0.5?mix3([56,84,32],[92,128,46],t*2):mix3([92,128,46],[140,170,72],(t-0.5)*2);
  const dry=smooth(0.2,0.5,fbmP(u+0.6,v+0.1,3,3,3));
  c=mix3(c,[150,138,72],dry*0.35);
  const sp=(Math.random()-0.5)*20;
  return [c[0]+sp,c[1]+sp,c[2]+sp*0.6];
}
function rockFn(u,v){
  const n=fbmP(u,v,5,5,5);
  const ridge=1-Math.abs(fbmP(u+0.2,v+0.5,6,6,4)*2.4);
  const crack=smooth(0.78,0.97,ridge);
  const strata=Math.sin((v*9+n*2.4)*Math.PI*2)*0.5+0.5;
  const base=118+n*60+strata*14;
  let c=[base+6,base+1,base-6];
  const k=1-crack*0.55;
  const sp=(Math.random()-0.5)*14;
  return [c[0]*k+sp,c[1]*k+sp,c[2]*k+sp];
}
function sandFn(u,v){
  const n=fbmP(u,v,10,10,3);
  const rip=Math.sin((u*16+n*2.5)*Math.PI*2)*0.04;
  const k=1+n*0.25+rip;
  const sp=(Math.random()-0.5)*16;
  return [214*k+sp,192*k+sp,148*k+sp];
}
function snowFn(u,v){
  const n=fbmP(u,v,8,8,4);
  const k=smooth(-0.3,0.4,n);
  const c=mix3([204,218,236],[240,244,250],k);
  const sp=(Math.random()-0.5)*8;
  return [c[0]+sp,c[1]+sp,c[2]+sp];
}
function barkFn(u,v){
  const n=fbmP(u,v,5,28,4);
  const crack=smooth(0.1,0.5,Math.abs(fbmP(u+0.4,v,9,48,3)*2));
  const t=clamp(0.5+n*1.6,0,1);
  const c=mix3([52,40,32],[112,94,78],t);
  const k=0.55+0.45*crack;
  return [c[0]*k,c[1]*k,c[2]*k];
}
function waterNormalCanvas(){
  const S=256,cv=document.createElement('canvas');cv.width=cv.height=S;
  const ctx=cv.getContext('2d'),img=ctx.createImageData(S,S),d=img.data;
  const hf=(u,v)=>fbmP(u,v,8,8,5);
  const e=1/S;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const u=x/S,v=y/S;
    const gx=hf(u+e,v)-hf(u-e,v),gz=hf(u,v+e)-hf(u,v-e);
    const o=(y*S+x)*4;
    d[o]=clamp(128+gx*S*3.4,0,255);d[o+1]=clamp(128+gz*S*3.4,0,255);
    d[o+2]=clamp(128+hf(u,v)*320,0,255);d[o+3]=255;
  }
  ctx.putImageData(img,0,0);return cv;
}
function leafCanvas(){
  const c=document.createElement('canvas');c.width=c.height=256;
  const g=c.getContext('2d'),r=mulberry32(77);
  function leaf(x,y,ang,len,wid,shade){

  function label(t,x,y,col){bctx.font='600 22px system-ui,sans-serif';bctx.textAlign='center';bctx.textBaseline='bottom';bctx.lineWidth=5;bctx.strokeStyle='rgba(8,18,26,.85)';bctx.strokeText(t,x,y);bctx.fillStyle=col||'#fff';bctx.fillText(t,x,y)}
  function drawBig(){
    const S=bmc.width;bctx.clearRect(0,0,S,S);bctx.drawImage(mapBase,0,0,S,S);
    let p=w2c(LAKE_C.x,LAKE_C.z,S);label('Lake',p[0],p[1]+8,'#cfeaff');
    p=w2c(PEAK.x,PEAK.z,S);bctx.beginPath();bctx.moveTo(p[0],p[1]-12);bctx.lineTo(p[0]+11,p[1]+8);bctx.lineTo(p[0]-11,p[1]+8);bctx.closePath();bctx.fillStyle='rgba(255,255,255,.9)';bctx.fill();bctx.lineWidth=2;bctx.strokeStyle='#33424e';bctx.stroke();label('Summit',p[0],p[1]-14,'#fff');
    for(const q0 of SITES){const pp=w2c(q0.x,q0.z,S);bctx.beginPath();bctx.arc(pp[0],pp[1],5,0,6.283);bctx.fillStyle='#ffd27a';bctx.fill();bctx.lineWidth=2;bctx.strokeStyle='#33424e';bctx.stroke();label(q0.n,pp[0],pp[1]-7,'#ffe9bd')}
    for(const [nm,Z] of [['Sunscar Desert',DESERT],['Mistmarsh',SWAMP],['Frostfields',FROST]]){const pp=w2c(Z.x,Z.z+Z.r*0.55,S);label(nm,pp[0],pp[1],'#fff')}
    for(const r of remotes.values()){
      if(r.fresh)continue;const q=w2c(r.x,r.z,S);
      bctx.beginPath();bctx.arc(q[0],q[1],11,0,6.283);bctx.fillStyle=shirt(r);bctx.fill();bctx.lineWidth=4;bctx.strokeStyle='#fff';bctx.stroke();label(r.pf.n,q[0],q[1]-15,'#fff');
    }
    const m=w2c(eyeV.x,eyeV.z,S);bctx.save();bctx.translate(m[0],m[1]);bctx.rotate(yaw);
    bctx.beginPath();bctx.moveTo(0,-16);bctx.lineTo(12,13);bctx.lineTo(0,7);bctx.lineTo(-12,13);bctx.closePath();bctx.fillStyle='#ffc56b';bctx.fill();bctx.lineWidth=3;bctx.strokeStyle='#14202a';bctx.stroke();bctx.restore();
    label('You',m[0],m[1]-20,'#ffd9a0');
    bctx.font='700 26px system-ui,sans-serif';bctx.textAlign='center';bctx.textBaseline='top';bctx.lineWidth=5;bctx.strokeStyle='rgba(8,18,26,.85)';bctx.strokeText('N ↑',S-36,10);bctx.fillStyle='#fff';bctx.fillText('N ↑',S-36,10);
  }
  function fillList(){
    bmlist.textContent='';
    const row=(col,name,info)=>{const d=document.createElement('div');d.className='bmrow';const i=document.createElement('i');i.style.background=col;const b=document.createElement('b');b.textContent=name;const sp=document.createElement('span');sp.textContent=info;d.append(i,b,sp);bmlist.appendChild(d)};
    row('#ffc56b','You',biomeAt(eyeV.x,eyeV.z));
    for(const r of remotes.values()){
      if(r.fresh){row(shirt(r),r.pf.n,'joining…');continue}
      const dx=r.x-eyeV.x,dz=r.z-eyeV.z;
      row(shirt(r),r.pf.n,biomeAt(r.x,r.z)+' · '+compass(dx,dz)+' · '+Math.round(Math.hypot(dx,dz))+' m');
    }
    if(!remotes.size){const d=document.createElement('p');d.className='bmnote';d.textContent=net.bk?'Nobody else is here yet. Share your room code!':'Join a room code to see friends on the map.';bmlist.appendChild(d)}
  }
  function setBig(on){
    bigOpen=on;big.classList.toggle('off',!on);
    if(on){drawBig();fillList();listT=0}
  }
  mini.addEventListener('click',()=>setBig(true));
  $('#bmx').addEventListener('click',()=>setBig(false));
  big.addEventListener('click',e=>{if(e.target===big)setBig(false)});
  window.addEventListener('keydown',e=>{
    if(e.code==='Escape'&&bigOpen){setBig(false);return}
    if(mode==='walk'&&!e.repeat&&e.code==='KeyM'){const t=e.target&&e.target.tagName;if(t!=='INPUT')setBig(!bigOpen)}
  });

  /* per-frame */
  let netAcc=0,vT=0,rlT=0,myG=0,myGT=0;
  const emBox=$('#emotes'),emBtn=$('#emoBtn');
  GEST.forEach((g,i)=>{if(!g)return;const b=document.createElement('button');b.type='button';b.innerHTML='<span class="ee">'+g.e+'</span><span class="en">'+g.n+'</span>';b.addEventListener('click',()=>{doGesture(i);setEm(false)});emBox.appendChild(b)});
  function setEm(on){emBox.classList.toggle('off',!on);emBtn.setAttribute('aria-pressed',String(on))}
  emBtn.addEventListener('click',()=>setEm(emBox.classList.contains('off')));
  function doGesture(i){
    myG=myG===i&&i===5?0:i;myGT=0;
    if(myG){const pop=$('#emoji');pop.textContent=GEST[i].e;pop.classList.remove('pop');void pop.offsetWidth;pop.classList.add('pop');setTip(GEST[i].n+(i===5?' — move to stand up':''))}
  }
  window.addEventListener('keydown',e=>{if(mode!=='walk'||e.repeat)return;const t=e.target&&e.target.tagName;if(t==='INPUT'||t==='TEXTAREA')return;const m=/^Digit([1-6])$/.exec(e.code);if(m)doGesture(+m[1])});
  function netTick(dt){
    if(mode==='walk')updateMyAvatar(dt);
    mapT+=dt;if(mapT>0.1&&mode==='walk'){mapT=0;drawMini();if(bigOpen){drawBig();listT+=0.1;if(listT>1){listT=0;fillList()}}}
    const cx=eyeV.x,cz=eyeV.z;
    for(const r of remotes.values()){
      if(r.fresh)continue;
      const k=1-Math.exp(-dt*9),ox=r.x,oz=r.z;
      r.x+=(r.tx-r.x)*k;r.y+=(r.ty-r.y)*k;r.z+=(r.tz-r.z)*k;r.yaw+=angDiff(r.tyaw,r.yaw)*k;
      const d=Math.hypot(r.x-cx,r.z-cz);
      r.av.visible=d<220;r.tag.visible=d<70;
      r.av.position.set(r.x,r.y,r.z);r.av.rotation.y=r.yaw;
      const sp=dt>0?Math.hypot(r.x-ox,r.z-oz)/dt:0;r.sp+=(sp-r.sp)*Math.min(1,dt*8);
      r.ph+=r.sp*dt*1.9;r.gt+=dt;
      const amt=Math.min(1,r.sp/3.5),sw=Math.sin(r.ph)*0.75*amt;
      const gid=r.sp>1.2?0:r.g,po=poseAvatar(r.av,gid,r.gt,sw,amt);
      r.av.position.y=r.y+po.oy;r.av.rotation.y=r.yaw+po.yo;
      if(gid&&d<70){
        if(!r.bub){r.bub=new THREE.Sprite(new THREE.SpriteMaterial({transparent:true,depthWrite:false,fog:false,toneMapped:false}));r.bub.scale.set(0.62,0.62,1);r.bub.renderOrder=10;r.av.add(r.bub)}
        const e=GEST[gid].e;if(r.bub.userData.e!==e){r.bub.userData.e=e;r.bub.material.map=bubbleFor(e);r.bub.material.needsUpdate=true}
        r.bub.position.y=(gid===5?1.55:2.0)+0.62+Math.sin(r.gt*3)*0.04;r.bub.visible=true;r.tag.position.y=2.0+(gid===5?-0.4:0);
      }else if(r.bub){r.bub.visible=false;r.tag.position.y=2.0}
      if(r.vg){const v=d<25?1:Math.max(0,1-(d-25)/115);r.vg.gain.setTargetAtTime(Math.pow(v,1.4),vctx.currentTime,0.08)}
    }
    if(net.bk&&!isHost()){const h=hostRemote();if(h){const d=((h.hh-hours+36)%24)-12;if(Math.abs(d)>1)hours=(hours+d+24)%24;else if(Math.abs(d)>0.012)hours=(hours+d*Math.min(1,dt*3)+24)%24}}
    vT+=dt;rlT+=dt;if(rlT>1){rlT=0;updateRoomLine()}
    if(vT>0.15){
      vT=0;
      for(const r of remotes.values()){
        if(!r.an)continue;r.an.getByteTimeDomainData(r.anBuf);let m=0;for(let i=0;i<r.anBuf.length;i++){const v=Math.abs(r.anBuf[i]-128);if(v>m)m=v}
        const sp=m>9;if(sp!==r.speaking){r.speaking=sp;r.tag.material.color.set(sp?0xffd27a:0xffffff);r.tag.scale.set(sp?1.7:1.5,sp?0.425:0.375,1)}
      }
    }
    if(myG){myGT+=dt;if(Math.hypot(vx,vz)>0.8||jumpHeld||(myG!==5&&GEST[myG].d&&myGT>GEST[myG].d))myG=0}
    if(net.bk&&mode==='walk'){
      netAcc+=dt;
      if(netAcc>=0.1){netAcc=0;net.bk.setState([+cx.toFixed(2),+(eyeV.y-1.7).toFixed(2),+cz.toFixed(2),+yaw.toFixed(3),+hours.toFixed(3),myT0,myG])}
    }
  }

  function enter(){
    mode='walk';
    P.x=0;P.z=0;yaw=0.667;pitch=-0.04;vx=vz=vy=0;off=0;gS=groundAt(0,0);
    camera.position.set(0,gS+1.7,0);eyeV.copy(camera.position);camera.rotation.set(pitch,yaw,0);
    applyGraphics(gfxMode);
    $('#intro').classList.add('gone');$('#hud').classList.add('on');
    setTimeout(()=>{$('#tip').classList.add('off')},7000);
    canvas.focus({preventScroll:true});
    startAudio();if(ac&&ac.state==='suspended')ac.resume();
  }
  async function startGame(){
    me=cleanProf(me);try{localStorage.setItem('vr.me',JSON.stringify(me))}catch(e){}
    const code=($('#rm').value||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,16);
    try{localStorage.setItem('vr.room',code)}catch(e){}
    if(window.__closePreview)window.__closePreview();
    enter();
    try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
    try{if(matchMedia('(orientation: portrait)').matches)setTip('Tip: turn your device sideways (landscape) for the best view.')}catch(e){}
    if(code)await openNet(code,me);
  }
  try{const u=new URLSearchParams(location.search).get('room');const rv=u||localStorage.getItem('vr.room')||'';$('#rm').value=rv.slice(0,16)}catch(e){}
  $('#enterBtn').addEventListener('click',startGame);
  (function(){
    const gm=$('#gmenu'),mb=$('#menuBtn');
    const setM=on=>{gm.classList.toggle('off',!on)};
    mb.addEventListener('click',()=>setM(true));
    $('#resumeBtn').addEventListener('click',()=>setM(false));
    gm.addEventListener('click',e=>{if(e.target===gm)setM(false)});
    window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#hud').classList.contains('on')===false)setM(gm.classList.contains('off'))});
    $('#leaveBtn').addEventListener('click',()=>{try{location.href=location.pathname}catch(e){location.reload()}});
    $('#rcBtn').addEventListener('click',()=>{const w=['fox','moss','fern','river','amber','pine','wolf','dune','frost','lark','reed','cedar'];$('#rm').value=(w[Math.random()*w.length|0]+(10+Math.random()*89|0)).toUpperCase()});
  })();

  /* loop */
  const clock=new THREE.Clock();
  let tAcc=0,hudT=0,emaDt=0.02,adaptT=0;const tgt=new THREE.Vector3();
  function hud(){
    const b=((-yaw*180/Math.PI)%360+360)%360,dirs=['N','NE','E','SE','S','SW','W','NW'];
    $('#hdg').textContent=dirs[Math.round(b/45)%8]+' '+String(Math.round(b)%360).padStart(3,'0')+'°';
    $('#alt').textContent='Alt '+Math.round(camera.position.y)+' m';
    $('#biome').textContent=biomeAt(P.x,P.z);
    $('#clock').textContent=clockText();
  }
  function frame(){
    requestAnimationFrame(frame);
    const dt=Math.min(clock.getDelta(),0.05);tAcc+=dt;
    emaDt=emaDt*0.95+dt*0.05;adaptT+=dt;
    if(adaptT>2.5){
      adaptT=0;
      if(emaDt>0.03&&pr>0.8){pr=Math.max(0.8,pr-0.15);resize()}
      else if(emaDt<0.0175&&pr<maxPR){pr=Math.min(maxPR,pr+0.1);resize()}
    }
    hours=(hours+dt/12)%24;
    applyTime();
    U.uTime.value=tAcc;windU.uTime.value=tAcc;netTick(dt);extrasTick(tAcc,dt);
    windU.uWind.value=0.75+0.35*Math.sin(tAcc*0.23)*Math.sin(tAcc*0.11+1);
    let groundH=5;
    if(mode==='orbit'){
      orbitA+=dt*0.045;
      const ox=Math.cos(orbitA)*340,oz=Math.sin(orbitA)*340;
      camera.position.set(ox,Math.max(130,heightAt(ox,oz)+40),oz);
      camera.lookAt(0,10,0);tgt.set(0,0,0);
    }else{
      walk(dt);
      tgt.set(camera.position.x,0,camera.position.z);
      groundH=heightAt(P.x,P.z);
      hudT+=dt;if(hudT>0.2){hudT=0;hud()}
      const high=camera.position.y-groundH>40;
      grassA.visible=grassB.visible=!high;
      if(!high&&Math.hypot(P.x-gcx,P.z-gcz)>6)rebuildGrass(P.x,P.z);
      audioUpdate(tAcc,camera.position.y,groundH);
    }
    sun.position.copy(tgt).addScaledVector(sunDir,170);sun.target.position.copy(tgt);
    moon.position.copy(tgt).addScaledVector(moonDir,170);moon.target.position.copy(tgt);
    sky.position.copy(camera.position);stars.position.copy(camera.position);
    water.position.set(camera.position.x,0,camera.position.z);
    if(ffMat.opacity>0.02){
      for(let j=0;j<FF;j++){
        ffPos[j*3]+=Math.cos(tAcc*0.9+j*1.7)*0.012;ffPos[j*3+1]+=Math.sin(tAcc*1.3+j)*0.01;ffPos[j*3+2]+=Math.sin(tAcc*0.8+j*2.3)*0.012;
        if(Math.hypot(ffPos[j*3]-camera.position.x,ffPos[j*3+2]-camera.position.z)>46)spawnFF(j,camera.position.x,camera.position.z);
      }
      ffGeo.attributes.position.needsUpdate=true;
    }
    renderer.render(scene,camera);
  }
  applyTime();
  frame();
  window.__verdant={makeAvatar,cleanProf,renderer,scene,camera,enter,remotes,net,openNet,closeNet,me:()=>me,voice,myId,THREE,tp:(x,z)=>{P.x=x;P.z=z},look:(y,pt)=>{yaw=y;pitch=pt},dbg:()=>({bridges:BRIDGES,sites:SITES.map(q=>[q.n,Math.round(q.x),Math.round(q.z),+q.h.toFixed(1)]),boats:boats.length,animals:animals.length,birds:birds.length,verts:worldMesh.geometry.attributes.position.count}),fly:(x,y,z,yw,pt)=>{P.x=x;P.z=z;flying=true;py=y;fvy=0;yaw=yw;pitch=pt},hrs:v=>{if(v!=null)hours=v;return hours}};
  $('#veil').classList.add('gone');
}

requestAnimationFrame(()=>{setTimeout(()=>{
  build().catch(err=>{
    say('The world could not start: '+(err&&err.message?err.message:'unknown error'));
    if(window.console)console.error(err);
  });
},40)});
})();
</script>
